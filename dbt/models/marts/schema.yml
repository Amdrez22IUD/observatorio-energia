version: 2

models:
  - name: dim_mes
    description: "Un mes con ventas. Grano: una fila por mes."
    columns:
      - name: mes_id
        data_tests: [unique, not_null]

  - name: dim_fecha
    description: "Calendario diario con atributos de fecha y fase ENSO. Grano: un día."
    columns:
      - name: fecha_id
        data_tests: [unique, not_null]

  - name: dim_hora
    description: "Horas del día. Grano: una fila por hora (1 a 24)."
    columns:
      - name: hora_id
        data_tests: [unique, not_null]

  - name: dim_municipio
    description: "Municipios de ventas EnerAndes identificados por DIVIPOLA. Grano: un municipio."
    columns:
      - name: municipio_id
        data_tests: [unique, not_null]

  - name: dim_segmento
    description: "Segmentos de clientes EnerAndes. Grano: un segmento."
    columns:
      - name: segmento_id
        data_tests: [unique, not_null]

  - name: dim_recurso
    description: "Plantas y recursos de XM; incluye claves históricas ausentes en el catálogo. Grano: un código de recurso."
    columns:
      - name: codigo_recurso
        data_tests: [unique, not_null]

  - name: fact_ventas_mensual
    description: "Ventas de energía 2023–2026. Grano: mes, municipio, segmento y tipo de compra."
    columns:
      - name: mes_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_mes')
                field: mes_id
      - name: fecha_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_id
      - name: municipio_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: municipio_id
      - name: segmento_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_segmento')
                field: segmento_id
      - name: tipo_compra
        data_tests:
          - accepted_values:
              arguments:
                values: ["Bolsa", "Contrato"]

  - name: fact_mercado_horario
    description: "Precio de bolsa y demanda de XM. Grano: fecha, hora y código de mercado."
    columns:
      - name: fecha_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_id
      - name: hora_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hora')
                field: hora_id

  - name: fact_generacion_recurso
    description: "Generación horaria de XM por planta. Grano: fecha, hora y código de recurso."
    columns:
      - name: fecha_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_id
      - name: hora_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hora')
                field: hora_id
      - name: codigo_recurso
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_recurso')
                field: codigo_recurso
